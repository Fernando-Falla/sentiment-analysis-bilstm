services:
  ml-bi-lstm:
    build: .
    container_name: ml-bi-lstm
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Artefactos del modelo (no versionados): ver data/models/README.md
      - ./data:/app/data
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
